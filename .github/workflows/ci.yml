name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Type Check
      run: npm run type-check
      
    - name: Unit Tests
      run: npm run test
      
    - name: Build
      run: npm run build
      env:
        DATABASE_URL: "postgresql://mock"
        AUTH_SECRET: "mock_secret"
